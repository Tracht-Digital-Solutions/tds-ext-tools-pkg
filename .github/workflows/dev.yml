name: Auto-release on push (→ @latest + site rebuild)

# Every push to main publishes a real @latest PATCH release and dispatches a
# rebuild of the dependent product (tds-admin-frontend). Use the manual Release
# button (release.yml) for a minor/major bump. The @latest bump commit carries
# [skip ci], so auto-pushing that commit does NOT re-trigger this workflow
# (no publish loop). Pipeline body in _build.yml.
#
# The dispatch targets the product's dev.yml (_build.yml's rebuild_workflow
# default) — a build, never a deploy. tds-admin-frontend is a Node application
# since 2026-08-25 and a push to its release branch takes the panel down on
# every path until Plesk restarts it, so a commit here must not be able to
# trigger one.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-publish
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    uses: ./.github/workflows/_build.yml
    with:
      publish_tag: latest
      bump: patch
      rebuild_site: tds-admin-frontend
    secrets: inherit
